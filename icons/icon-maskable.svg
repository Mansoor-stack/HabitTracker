      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background with safe zone for maskable -->
  <rect width="512" height="512" fill="url(#bg)"/>
