  <!-- Target circle middle -->
  <circle cx="256" cy="256" r="85" fill="none" stroke="white" stroke-width="16" opacity="0.5"/>
  <!-- Target circle inner -->
  <circle cx="256" cy="256" r="50" fill="none" stroke="white" stroke-width="12" opacity="0.7"/>
  <!-- Bullseye -->
  <circle cx="256" cy="256" r="20" fill="white"/>
